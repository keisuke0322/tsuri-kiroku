name: Update Issue lifecycle labels
on:
  issues:
    types: [opened]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, ready_for_review]
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-lifecycle
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always execute trusted base-branch code, never PR content.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { updateEvent } = require('./scripts/issue-status.cjs');
            await updateEvent({ github, context });
