name: Deploy Cloudflare
on:
  push:
    branches: [cloudflare-migration, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
  pull-requests: read
concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: false
jobs:
  pr-checks:
    name: PR checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - name: Require PR head to have passed staging
        uses: actions/github-script@v7
        with:
          script: |
            const { checkPullRequest } = require('./scripts/deployment-policy.cjs');
            await checkPullRequest({ github, context, log: core.info });
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare-migration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a merged PR with successful staging
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { checkProduction } = require('./scripts/deployment-policy.cjs');
            await checkProduction({ github, context, log: core.info });
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run typecheck
      - run: corepack pnpm test
      - name: Configure target
        run: node scripts/cloudflare-config.mjs "$TARGET_ENV"
        env:
          TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - run: corepack pnpm build
        env:
          CF_CONFIG: wrangler.deploy.json
      - name: Apply this environment's migrations
        run: corepack pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy tested build
        run: corepack pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify unauthenticated access
        run: node scripts/cloudflare-smoke.mjs
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
