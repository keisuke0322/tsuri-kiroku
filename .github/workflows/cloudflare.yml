name: Deploy Cloudflare
on:
  push:
    branches: [cloudflare-migration, main]
  pull_request:
    branches: [main]
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        ready_for_review,
        labeled,
        unlabeled,
      ]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: start-update
        options:
          [
            start-update,
            development,
            validate-update,
            abort-update,
            restore-development,
          ]
      pr:
        description: 更新PR番号（start-updateで準備・CI待ち・staging検証を連続実行）
        type: string
permissions:
  contents: read
  deployments: read
  pull-requests: read
  actions: read
  issues: read
concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: false
jobs:
  formatting:
    name: Formatting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run format:check
  pr-checks:
    name: PR checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Policy code comes from the trusted base, never the PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Require PR head to have passed staging
        uses: actions/github-script@v7
        with:
          script: |
            const { checkPullRequest } = require('./scripts/deployment-policy.cjs');
            await checkPullRequest({ github, context, log: core.info, skipFeatureGate: true });
            const { data: pkg } = await github.rest.repos.getContent({ ...context.repo,
              path: 'package.json', ref: context.payload.pull_request.head.sha });
            if (pkg.type !== 'file' || pkg.encoding !== 'base64') throw Error('Missing manifest');
            const manifest = JSON.parse(Buffer.from(pkg.content, 'base64').toString('utf8'));
            require('node:fs').writeFileSync('package.json', JSON.stringify({ version: manifest.version }));
            const { validateRelease } = require('./scripts/release-policy.cjs');
            await validateRelease({ github, context, pr: context.payload.pull_request });

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare-migration')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.ref == 'refs/heads/main' && (inputs.action == '' || inputs.action == 'development') && 'production' || 'staging' }}
    permissions:
      contents: write
      deployments: read
      # Dependency validation/abort removes the approval label from PRs.
      pull-requests: write
      actions: read
      issues: write
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && (inputs.action == '' || inputs.action == 'development') && 'cloudflare-production' || 'shared-staging' }}
      cancel-in-progress: false
    outputs:
      record-artifact: ${{ steps.record-name.outputs.name }}
      kind: ${{ steps.select.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.action == 'start-update' && 'main' || github.sha }}
          persist-credentials: false
      - name: Prepare dependency update and wait for CI
        id: prepare-update
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'start-update'
        uses: actions/github-script@v7
        env:
          UPDATE_PR: ${{ inputs.pr }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { startUpdate } = require('./scripts/dependency-control.cjs');
            const target = await startUpdate({ github, context, log: core.info }, process.env.UPDATE_PR);
            core.setOutput('head', target.head);
            await core.summary.addHeading('更新の準備・CI確認成功')
              .addRaw(`PR #${target.pr}: ${target.head}`).write();
      - name: Select source and acquire durable staging ownership
        id: select
        uses: actions/github-script@v7
        env:
          CONTROL_ACTION: ${{ inputs.action == 'start-update' && 'validate-update' || inputs.action || 'development' }}
          UPDATE_PR: ${{ inputs.pr }}
          EXPECTED_UPDATE_HEAD: ${{ steps.prepare-update.outputs.head }}
        with:
          script: |
            const { selectDeployment } = require('./scripts/dependency-control.cjs');
            const selection = await selectDeployment({ github, context }, {
              action: process.env.CONTROL_ACTION, number: process.env.UPDATE_PR,
              expectedHead: process.env.EXPECTED_UPDATE_HEAD });
            core.setOutput('selection', JSON.stringify(selection));
            core.setOutput('sha', selection.sha);
            core.setOutput('kind', selection.kind);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a merged PR with successful staging
        if: steps.select.outputs.kind == 'production'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { checkProduction } = require('./scripts/deployment-policy.cjs');
            await checkProduction({ github, context, log: core.info });
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare deployment identity and release specification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { prepareRecord } = require('./scripts/deployment-record.cjs');
            await prepareRecord({ github, context, selection: ${{ steps.select.outputs.selection }} });
      - name: Name deployment record
        id: record-name
        run: echo "name=deployment-record-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run format:check
      - run: corepack pnpm run typecheck
      - run: corepack pnpm test
      - name: Configure target
        run: node scripts/cloudflare-config.mjs "$TARGET_ENV"
        env:
          TARGET_ENV: ${{ steps.select.outputs.kind == 'production' && 'production' || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          PHOTO_STORAGE_GLOBAL_LIMIT_BYTES: ${{ vars.PHOTO_STORAGE_GLOBAL_LIMIT_BYTES }}
          PHOTO_STORAGE_USER_LIMIT_BYTES: ${{ vars.PHOTO_STORAGE_USER_LIMIT_BYTES }}
      - run: corepack pnpm build
        env:
          CF_CONFIG: wrangler.deploy.json
      - name: Recheck production authorization immediately before writes
        if: steps.select.outputs.kind == 'production'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { checkProduction } = require('./scripts/deployment-policy.cjs');
            const { pr } = await checkProduction({ github, context, log: core.info });
            const { validateRelease } = require('./scripts/release-policy.cjs');
            await validateRelease({ github, context, pr, production: true });
      - name: Apply compatible migrations before deployment
        run: node scripts/cloudflare-migrations.mjs before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy tested build
        run: corepack pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify unauthenticated access
        run: node scripts/cloudflare-smoke.mjs
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      - name: Remove retired guest schema with a D1 recovery bookmark
        run: node scripts/cloudflare-migrations.mjs after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify unauthenticated access after schema cleanup
        run: node scripts/cloudflare-smoke.mjs
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      - name: Install Cypress browser
        if: steps.select.outputs.kind != 'production'
        run: corepack pnpm exec cypress install
      - name: Run authenticated staging E2E
        if: steps.select.outputs.kind != 'production'
        run: corepack pnpm run e2e:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          E2E_OTHER_USER_ID: ${{ secrets.E2E_OTHER_USER_ID }}
          E2E_BROWSER: chrome
      - name: Save E2E failure screenshots
        if: failure() && steps.select.outputs.kind != 'production'
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-screenshots-${{ github.sha }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify running version and record deployment result
        if: always() && steps.record-name.outcome == 'success'
        run: node scripts/verify-version.mjs
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Preserve deployment provenance
        if: always() && steps.record-name.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.record-name.outputs.name }}
          path: .release-runtime/record.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Record successful update validation or restoration
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { finishDeployment } = require('./scripts/dependency-control.cjs');
            await finishDeployment({ github, context }, ${{ steps.select.outputs.selection }});
      - name: Refresh release gates after validation
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            try {
              await github.rest.repos.getContent({ ...context.repo, path: '.github/workflows/dependency-governance.yml', ref: 'main' });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Dependency governance is not on main yet; activation follows production release.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({ ...context.repo,
              workflow_id: 'dependency-governance.yml', ref: 'main', inputs: { action: 'refresh' } });

  release:
    name: Publish Release
    needs: deploy
    if: needs.deploy.result == 'success' && github.ref == 'refs/heads/main' && (inputs.action == '' || inputs.action == 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.deploy.outputs.record-artifact }}
          path: .release-runtime
      - name: Publish immutable tag and Release
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { publishRelease } = require('./scripts/release-policy.cjs');
            const record = JSON.parse(readFileSync('.release-runtime/record.json', 'utf8'));
            const release = await publishRelease({ github, context, record });
            await core.summary.addHeading('GitHub Release作成成功').addLink(release.tag_name, release.html_url).write();
      - name: Describe Release failure
        if: failure()
        run: echo '本番デプロイは成功しましたがRelease作成は未完了です。原因を解消し、この実行の失敗ジョブのみ再実行してください。本番の再デプロイは不要です。' >> "$GITHUB_STEP_SUMMARY"

  issue-status:
    name: Update Project Status after successful deployment
    needs: [deploy, release]
    if: >-
      always() && needs.deploy.result == 'success' &&
      (needs.release.result == 'success' ||
       (needs.deploy.outputs.kind == 'development' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: project-7-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { updateDeployment } = require('./scripts/issue-status.cjs');
            await updateDeployment({ github, context, log: core.info });

  sync-published:
    name: Sync published main to development
    needs: [deploy, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: published-main-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { syncPublished, cleanupMerged } = require('./scripts/dependency-sync.cjs');
            await syncPublished({ github, context });
            await cleanupMerged({ github, context });

  restore-staging:
    name: Restore development staging after publication
    permissions:
      contents: read
      actions: write
    needs: [deploy, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { readState } = require('./scripts/dependency-state.cjs');
            const state = await readState({ github, context });
            if (!state.lease) {
              core.info('No dependency update owns staging; restoration is not required.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({ ...context.repo,
              workflow_id: 'cloudflare.yml', ref: 'main',
              inputs: { action: 'restore-development' } });
