name: Contribution checks
on:
  pull_request:
    branches: [cloudflare-migration, main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: contribution-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    name: Contribution checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run format:check
      - run: corepack pnpm run typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - name: Record tested published sync commits
        if: github.base_ref == 'cloudflare-migration' && github.head_ref == 'automation/published-main' && github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/sync-ci-record.cjs
      - name: Preserve tested published sync identity
        if: github.base_ref == 'cloudflare-migration' && github.head_ref == 'automation/published-main' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: published-sync-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.base.sha }}
          path: .sync-ci/record.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
